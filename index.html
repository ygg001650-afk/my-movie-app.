<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة البث</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">موقعي</div>
    <nav>
      <button onclick="switchCategory('movie')">الأفلام</button>
      <button onclick="switchCategory('tv')">المسلسلات</button>
    </nav>
  </header>

  <main class="container">
    <!-- مشغل الفيديو -->
    <section class="player-container">
      <div class="iframe-wrapper">
        <iframe id="player-iframe" src="" allowfullscreen frameborder="0"></iframe>
      </div>
    </section>

    <!-- قائمة العرض -->
    <section class="grid-section">
      <h2 id="section-title">الأفلام الشائعة</h2>
      <div id="content-container" class="movies-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
